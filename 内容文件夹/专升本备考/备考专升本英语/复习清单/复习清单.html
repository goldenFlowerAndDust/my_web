<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复习打卡</title>
    <link rel="stylesheet" href="复习打卡.css">
</head>
<body>
<main>
    <header>
        <h1>复习打卡</h1>

    <p class="switch-link"><a href="核心词汇复习清单.html">→ 词汇复习清单（全部分类 · 每天 20 个新词）</a> · <a href="../使用指南.html">使用指南</a></p>

        <div class="toolbar">
            <button id="btn-reload">🔄 重新加载</button>

        <h2 id="today-title">今天要复习的</h2>
        <ul id="due-list" class="review-list"></ul>

        <h2>全部词条</h2>
        <ul id="all-list" class="review-list"></ul>
