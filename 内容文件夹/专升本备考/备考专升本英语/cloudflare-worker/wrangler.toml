name = "english-tutor"
main = "worker.js"
compatibility_date = "2026-10-30"

[vars]
DEEPSEEK_MODEL = "deepseek-chat"
RATE_LIMIT_PER_MINUTE = "10"
LOG_TTL_DAYS = "180"
# 第一次测试用 *；确认来源后改成 https://你的用户名.github.io
ALLOWED_ORIGIN = "*"

[[kv_namespaces]]
binding = "TUTOR_KV"
# 运行 wrangler kv namespace create TUTOR_KV 后把 id 填到这里
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 不要在这里写 DEEPSEEK_API_KEY 或 TUTOR_ACCESS_TOKEN，
# 用 wrangler secret put 或 Dashboard Secret。
