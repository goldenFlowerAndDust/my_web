<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以-ess结尾</title>
    <link rel="stylesheet" href="../../../frontend——前端/JavaScript/JavaScript通用样式表.css">

    <!--单词独有样式-->
    <link rel="stylesheet" href="../单词独有样式表.css">
</head>
<body>
<main>
    <!--例子由：word_div包裹(ol,ul)，单词用en类，词义用zh类，注释/额外提示用：note类-->
    <header>
        <h1>以[ess]结尾的单词</h1>
    </header>
    <section id="section_1">
        <h2>名词 + <code>ess</code> = 女性 (现代逐渐被中性词取代)</h2>
        <h3>如</h3>
        <ol class="word_div">
            <li><span><code class="en">actor(<span class="zh">演员</span>)</code>————><code
                    class="en">actress(<span class="zh">女演员</span>)</code></span>
            </li>
            <li><span><code class="en">waiter(<span class="zh">服务员</span>)</code>————><code
                    class="en">waitress(<span class="zh">女服务员</span>)</code></span>
            </li>
            <li><span><code class="en">god(<span class="zh">神</span>)</code>————><code
                    class="en">goddess(<span class="zh">女神</span>)</code></span>
            </li>
            <li><span><code class="en">prince(<span class="zh">王子</span>)</code>————><code
                    class="en">princess(<span class="zh">公主</span>)</code></span>
            </li>
            <li><span><code class="en">host(<span class="zh">主人</span>)</code>————><code
                    class="en">hostess(<span class="zh">女主人</span>)</code></span>
            </li>
            <li><span><code class="en">lion(<span class="zh">狮子</span>)</code>————><code
                    class="en">lioness(<span class="zh">母狮</span>)</code></span>
            </li>
            <li><span><code class="en">songster(<span class="zh">歌手</span>)</code>————><code
                    class="en">songstress(<span class="zh">女歌手</span>)</code></span>
            </li>
        </ol>
    </section>
    <section id="section_2"></section>
</main>
<script src="../../../自建网站中用到的外部引用/JS文件/JavaScript通用a标签跳转指定内容.js">

</script>
<!--单词显示与隐藏-->
<script src="../显示或隐藏.js"></script>
</body>
</html>
