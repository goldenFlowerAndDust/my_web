<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以-ster结尾</title>
    <link rel="stylesheet" href="../../../frontend——前端/JavaScript/JavaScript通用样式表.css">

    <!--单词独有样式-->
    <link rel="stylesheet" href="../单词独有样式表.css">
</head>
<body>
<main>
    <!--例子由：word_div包裹(ol,ul)，单词用en类，词义用zh类，注释/额外提示用：note类-->
    <header>
        <h1>以[ster]结尾的单词</h1>
    </header>
    <section id="section_1">
        <h2>名词 + <code>ster</code> = 与名词相关的人(偏老旧/口语/贬义)</h2>
        <h3>如</h3>
        <ol class="word_div">
            <li><span><code class="en">song(<span class="zh">歌</span>)</code>————><code
                    class="en">songster(<span class="zh">歌手</span>)</code></span>
            </li>
            <li><span><code class="en">gang(<span class="zh">帮派</span>)</code>————><code
                    class="en">gangster(<span class="zh">匪徒</span>)</code></span>
            </li>
            <li><span><code class="en">trick(<span class="zh">诡计</span>)</code>————><code
                    class="en">trickster(<span class="zh">骗子</span>)</code></span>
            </li>
            <li><span><code class="en">young(<span class="zh">年轻</span>)</code>————><code
                    class="en">youngster(<span class="zh">年轻人</span>)</code></span>
            </li>
            <li><span><code class="en">spin(<span class="zh">纺织</span>)</code>————><code
                    class="en">spinster(<span class="zh">老处女</span>)</code></span>
            </li>
            <li><span><code class="en">prank(<span class="zh">恶作剧</span>)</code>————><code
                    class="en">prankster(<span class="zh">恶作剧者</span>)</code></span>
            </li>
        </ol>
    </section>
    <section id="section_2"></section>
</main>
<script src="../../../自建网站中用到的外部引用/JS文件/JavaScript通用a标签跳转指定内容.js">

    //<a href="目标.html" onclick="loadContent('目标.html', '容器ID','锚点ID'); return false;">链接</a>

    // 锚点不能其他符号，只能是字符
</script>
<!--单词显示与隐藏-->
<script src="../显示或隐藏.js"></script>
</body>
</html>
