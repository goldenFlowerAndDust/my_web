<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fish以及扩展</title>
    <link rel="stylesheet" href="../../../frontend——前端/JavaScript/JavaScript通用样式表.css">

    <!--单词独有样式-->
    <link rel="stylesheet" href="../单词独有样式表.css">
</head>
<body id="fish家族">
<main>
    <!--例子由：word_div包裹(ol,ul)，单词用en类，词义用zh类，注释/额外提示用：note类-->
    <header>
        <h1>fish以及扩展</h1>
    </header>
    <section id="section_1">
        <ol class="word_div">
            <li><span><code class="en">fish</code>(<span class="zh">名词：<span class="span">鱼、鱼肉</span>，动词：<span
                    class="span">钓鱼、捕鱼、抓鱼</span></span>)</span></li>
            <li><span><code class="en">fishing(<span class="zh">名词：<span class="span">钓鱼、捕鱼</span>，动词：<span
                    class="span">钓鱼、捕鱼</span>，<span class="note">"fish"的现在分词</span></span>)</code></span></li>
            <li>
                <span class="en">fishing net(<span class="zh">渔网</span>)</span>
                <br><span class="en">net(<span class="zh">名词：<span class="span">因特网</span></span>)</span>
                <br><span class="note">所以：<span>捕鱼 + 网 = 渔网</span></span>
            </li>
        </ol>
    </section>
    <section id="section_2"></section>
</main>
<script src="../../../自建网站中用到的外部引用/JS文件/JavaScript通用a标签跳转指定内容.js">

    //<a href="目标.html" onclick="loadContent('目标.html', '容器ID','锚点ID'); return false;">链接</a>

    // 锚点不能其他符号，只能是字符
</script>
<!--单词显示与隐藏-->
<script src="../显示或隐藏.js"></script>
</body>
</html>
