<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>第三次作业</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        main{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        section{
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 15rem;
            height: 30rem;
            border: 1px solid black;
            background-color: orange;
            gap: 1rem;
        }
        #studentNum{
            font-size: 2rem;
        }
        #studentName{
            font-size: 2.5rem;
        }
        button{
            font-size: 2rem;
        }
    </style>
    <script type="text/javascript" src="第三次作业.js"></script>
</head>
<body>
    <main>
        <section>
            <div id="studentNum">18</div>
            <div id="studentName">王八</div>
            <button id="open" onclick="startScroll()">开始点名</button>
            <button id="stop" onclick="stopScroll()">结束</button>
        </section>
    </main>
</body>
</html>
