<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一、二节——前端布局的重要性_布局演变历程概览</title>
    <link rel="stylesheet" href="../前端布局通用样式表.css">
</head>
<body>
<main>
    <h1>前端布局的重要性_布局演变历程概览</h1>
    <div>
        <h2>重要性</h2>
        <ul>
            <li>用户体验</li>
            <li>网站易用性</li>
            <li>SEO方面</li>
        </ul>
    </div>
    <div>
        <h2>演变历程</h2>
        <ul>
            <li>
                <p>网页布局的起源开始</p>
                <ol>
                    <li>最初——表格布局</li>
                    <li>然后——div+css(最重要的转折点)—【div+css定位、浮动、属性布局】<span>标志的标准化、模块化</span></li>
                    <li>接着——flexbox布局——解决问题(<span>水平垂直居中、任意方向上灵活伸缩</span>)</li>
                    <li>最后——grid布局——带来了二维布局——实现(<span>多行多列、自定义间距、比例分配空间</span>)</li>
                </ol>
            </li>
        </ul>
    </div>
</main>

</body>
</html>
