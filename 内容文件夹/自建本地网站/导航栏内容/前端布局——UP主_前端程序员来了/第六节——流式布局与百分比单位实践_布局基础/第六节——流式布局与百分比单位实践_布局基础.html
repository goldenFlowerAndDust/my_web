<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第六节——流式布局与百分比单位实践_布局基础</title>
    <link rel="stylesheet" href="../前端布局通用样式表.css">
    <style>
        .container{
            display: flex;/* 弹性布局 */
            flex-wrap: wrap; /* 允许自动换行 */
        }
        .item{
            box-sizing: border-box;/* 浏览器盒模型 */
            padding: 10px;
            width:calc(90% - 20px);/* calc计算器，将宽度计算为容器宽度的33.33% - 20px(左右内边距) */
            margin-bottom:20px;
        }
        img{
            width: 100%;
            height: auto;
        }
        video{
            width: 100%;
            height: auto;
        }
        @media (max-width: 3000px) { /* 媒体查询:media 设置的是:当最大宽度为3000px采用该样式 */
            .item{
                width: calc(50% - 20px);
            }
        }
        @media (max-width: 1200px) { /* 设置的是:当最大宽度为1200px采用该样式 */
            .item{
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>流式布局与百分比单位实践_布局基础</h1>
    <div>
        <h2>流式布局</h2>
        <ul>
            <li>通过元素相对尺寸比，呈现网页设计的内容</li>
            <li>尤其作用于多设备兼容性</li>
        </ul>
    </div>
    <div>
        <h2>百分比单位</h2>
        <ul>
            <li>主要理解：百分比单位的内涵</li>
            <li></li>
        </ul>
    </div>
    <div>
        <h2>试验区</h2>
        <ul>
            <li>共包含3张图片</li>
            <li>使用媒体查询构建响应式</li>
        </ul>
        <div class="container">
            <div class="item">
                <img src="./image/风景图片_1.jpg"
                     alt="风景图片">
                <img src="./image/风景图片_2.jpg"
                     alt="风景图片">
                <img src="./image/风景图片_3.jpg"
                     alt="风景图片">
                <video controls src="video/试验区%20未添加响应式.mp4"></video>
                <video controls src="video/试验区%20添加响应式.mp4"></video>
            </div>
        </div>
    </div>
</main>
</body>
</html>
