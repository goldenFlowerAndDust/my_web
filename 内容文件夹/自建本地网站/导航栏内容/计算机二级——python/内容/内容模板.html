<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面标题</title>
    <!-- ===== 核心样式表（包含导航栏所有样式） ===== -->
    <link rel="stylesheet" href="../../../../自建网站中用到的外部引用/自建网站用的样式表/二级python样式表.css">
</head>
<body>

<main>
    <!-- ============================================================
         ⬇️⬇️⬇️ 导航栏（复制此结构到任何页面） ⬇️⬇️⬇️
         ============================================================ -->
    <section class="transition" id="transition">
        <nav id="目录">
            <ul>
                <!-- ===== 一级菜单项 1（无子菜单，直接跳转） ===== -->
                <li><a href="#锚点ID">一级菜单</a></li>

                <!-- ===== 一级菜单项 2（带二级下拉菜单） ===== -->
                <!-- 注意：id 用于定位，href="#id" 跳转到页面内锚点 -->
                <li id="父级ID"><a href="#"><p>有二级菜单</p></a>
                    <ol>
                        <li><a href="#子锚点1">二级菜单项 1</a></li>
                        <li><a href="#子锚点2">二级菜单项 2</a></li>
                    </ol>
                </li>

                <!-- ===== 一级菜单项 3（带二级 + 三级菜单） ===== -->
                <!-- 三级菜单必须加 class="nav_2"！！！ -->
                <li id="父级ID2"><a href="#"><p>有三级菜单</p></a>
                    <ol>
                        <!-- 二级菜单项本身带有三级子菜单 -->
                        <li style="color: white;">
                            <p>二级菜单（不可点击）</p>
                            <!-- 三级菜单：class="nav_2" 是必须的 -->
                            <ol class="nav_2">
                                <li><a href="#三级锚点1">三级菜单项 1</a></li>
                                <li><a href="#三级锚点2">三级菜单项 2</a></li>
                            </ol>
                        </li>
                        <li style="color: white;">
                            <p>另一个二级菜单</p>
                            <ol class="nav_2">
                                <li><a href="#三级锚点3">三级菜单项 3</a></li>
                            </ol>
                        </li>
                    </ol>
                </li>

                <!-- ===== 一级菜单项 4（带二级 + 三级 + 四级菜单） ===== -->
                <li id="父级ID3"><a href="#"><p>有四级菜单</p></a>
                    <ol>
                        <li style="color: white;">
                            <p>二级菜单</p>
                            <ol class="nav_2">
                                <li>
                                    <a href="#">三级菜单（带四级）</a>
                                    <!-- 四级菜单：直接嵌套 <ol>，不需要额外类名 -->
                                    <ol>
                                        <li><a href="#四级锚点1">四级菜单项 1</a></li>
                                        <li><a href="#四级锚点2">四级菜单项 2</a></li>
                                    </ol>
                                </li>
                            </ol>
                        </li>
                    </ol>
                </li>
            </ul>
        </nav>
        <!-- 动画占位块（可保留或删除） -->
        <div>
            <p>页面标题/描述</p>
        </div>
    </section>

    <!-- ============================================================
         ⬇️⬇️⬇️ 页面主体内容（你的笔记/题目/其他内容） ⬇️⬇️⬇️
         ============================================================ -->
    <section class="SingleChoiceQuestion">
        <!-- 这里放你的内容 -->
    </section>

    <!-- ===== 页脚 ===== -->
    <footer>
        <p>页脚信息</p>
    </footer>
</main>

<!-- ============================================================
     ⬇️⬇️⬇️ JavaScript（动态加载功能，如不需要可删除） ⬇️⬇️⬇️
     ============================================================ -->
<script src="../../../../自建网站中用到的外部引用/JS文件/JavaScript通用a标签跳转指定内容.js">
    // 用法示例：
    // <a href="目标.html" onclick="loadContent(this, '容器ID', '#锚点ID'); return false;">链接</a>
    // <div id="容器ID"></div>
</script>

</body>
</html>
