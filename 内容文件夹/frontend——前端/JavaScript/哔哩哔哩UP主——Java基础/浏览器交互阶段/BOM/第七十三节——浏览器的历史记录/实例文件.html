<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器的地址栏</title>
</head>
<body>
<main>
    <button type="button" id="btn">history.forword</button>
    <script type="text/javascript">
        // 获取浏览器地址信息：location.href
        //可以看到，地址将中文变成了url编码
        document.getElementById('btn').onclick = () => {
            // location.href = '第七十三节——浏览器的历史记录.html' // 通过赋值，可以绑定事件的方式，实现跳转功能。
            // 因为当前还没有后退标签页，所以暂时使用 location.href替代
            // 现在浏览器存储了，当前标签页的后一个标签页的记录，可以使用 history.forward()了
            window.history.forward() // 当前状态因为有前进的记录，可以使用，但是刷新后，记录消失变没有了办法
        }
    </script>
    <section id="section_2"></section>
    <!--<footer>
        <p>以上知识均是学习笔记来源于哔哩哔哩UP主——Java基础</p>
    </footer>-->
</main>
</body>
</html>
