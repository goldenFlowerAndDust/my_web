<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>浏览器器存储数据</title>
</head>
<body>
<label>
	<input type="text" id="Text">
	<input type="button" id="btn" value="保存临时数据">
	<input type="button" id="newbtn" value="刷新">
</label>
<div id="newtext"></div>
<script type="text/javascript">
	// 先获取
	let text = document.getElementById("Text")
	
	document.getElementById("btn").addEventListener('click',()=>{
		// 每次读取获取文本内容
		let text_count = text.value
		sessionStorage.setItem("tempData",text_count)
		alert("临时保存数据成功")
		text.value = ''
	})
	// 再获取
	newtext = document.getElementById("newtext")
	document.getElementById("newbtn").addEventListener("click",()=>{
		// 获取存放在 essionStorage的数据
		let text = sessionStorage.getItem("tempData")
		newtext.innerHTML = `存放的数据是：${text}`
	})
</script>
</body>
</html>
