<!DOCTYPE html>
<html lang="en">
<html>
<head>
<meta charset="UTF-8">
<title>浏览器数据存储</title>
</head>
<body>
<label>
	<input type="text" id="text">
	<input type="button" id="btn" value="保存临时数据">
	<input type="button" id="newBtn" value="刷新">
</label>
<div id="newText"></div>
<script type="text/javascript">
	let Text = document.getElementById("text")
	document.getElementById("btn").addEventListener('click',()=>{
		let text_count = Text.value
		sessionStorage.setItem("tempData",text_count)
		alert("临时数据保存成功")
		Text.value = ''
	})
	newText = document.getElementById("newText")
	document.getElementById("newBtn").addEventListener('click',()=>{
		// 获取
		let text = sessionStorage.getItem("tempData")
		newText.innerHTML  = `临时存储的数据是：${text}`
	})
</script>
</body>
</html>
