<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>增加和删除订单</title>
		<link rel="stylesheet" type="text/css" href="作业.css" />
	</head>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		input[type="text"]{
			width: 100%;
			height: 100%;
			border: none;
		}
		th {
			border: 1px solid black;
		}
	</style>
	<body>
		<table border="0" cellspacing="0" cellpadding="0" id="order">
			<tr id="del1">
				<th><div contenteditable id="name2"></div></th>
				<th><div contenteditable id="number2"></div></th>
				<th><div contenteditable id="num3"></div></th>
				<th colspan="4" style="height: 30px">
					<input name="addOrder" type="button" value="增加订单" id="ZJ"/>
				</th>
			</tr>
			<tr class="title">
				<td>商品名称</td>
				<td>数量</td>
				<td>价格</td>
				<td>操作</td>
			</tr>
			<tr>
				<td>防滑真皮休闲鞋</td>
				<td>12</td>
				<td>&yen;568.50</td>
				<td>
					<input name="rowdel" type="button" value="删除" />
				</td>
			</tr>
			<tbody id=tbody>
				
			</tbody>
			<tr>
				
			</tr>
		</table>
		<script type="text/javascript" src="作业.js"></script>
	</body>
</html>
