<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
        }

        section {
            width: 90rem;
            margin: 0 auto;
            min-height: 20rem;
            text-align: center;
            background-color: #ddd;
        }

        table {
            width: 95%;
            margin: 25px;
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
        }

        button {
            width: 100%;
            height: 100%;
        }

        ul {
            padding: 25px;
        }
    </style>
</head>
<body>
<header>
    <h1>简易成绩查询</h1>
</header>
<h2>要求</h2>
<ul>
    <li>用户可以输入学生生，学生所在城市、学生各科成绩</li>
    <li>
        可查询：同城学生各科成绩总和高于平均分的学生、平均成绩小于80分的学生，平均成绩大于90分的学生、某城市平均成绩小于80分的学生、某城市平均成绩大于95分的顶尖学生
    </li>
    <li>将查询结果正确显示出来</li>
</ul>
<section>
    <table>
        <tr>
            <th>请输入城市名</th>
            <th>请输入学生名</th>
            <th>请输入语文成绩</th>
            <th>请输入数学成绩</th>
            <th>请输入英语成绩</th>
            <th>平均分</th>
        </tr>
        <tr id="inputRow">
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td colspan="1">
                <div class="oper" contenteditable="true"></div>
            </td>
        </tr>
        <tbody id="score">

        </tbody>
        <tr>
            <td>
                <button type="button" id="enter_grades">录入成绩</button>
            </td>
            <td>
                <button type="button" id="city_avgScore">同城学生各科成绩总和高于平均分的学生</button>
            </td>
            <td>
                <button type="button" id="eight_Avg">平均成绩小于80分的学生</button>
            </td>
            <td>
                <button type="button" id="nine_Avg">平均成绩大于90分的学生</button>
            </td>
            <td>
                <button type="button" id="city_eightAvg">某城市平均成绩小于80分的学生</button>
            </td>
            <td>
                <button type="button" id="city_nineAvg">某城市平均成绩大于95分的顶尖学生</button>
            </td>
        </tr>
        <tbody id="scoreResult">

        </tbody>
        <tr>
            <td colspan="6">
                <button id="clear">清除所有</button>
            </td>
        </tr>
    </table>
    <script type="text/javascript" src="简易成绩查询——录入成绩.js"></script>
    <script type="text/javascript" src="简易成绩查询——完善查询.js"></script>
    <script type="text/javascript" src="简易成绩查询——重置.js"></script>
</section>
</body>
</html>
