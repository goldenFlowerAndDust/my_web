<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
        }

        section {
            width: 90rem;
            margin: 0 auto;
            min-height: 20rem;
            text-align: center;
            background-color: #ddd;
        }

        table {
            width: 95%;
            margin: 25px;
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
        }

        button {
            width: 100%;
            height: 100%;
        }

        ul {
            padding: 25px;
        }
    </style>
</head>
<body>
<header>
    <h1>简易成绩查询</h1>
</header>
<h2>要求</h2>
<ul>
    <li>用户可以输入学生生，学生所在城市、学生各科成绩</li>
    <li>
        可查询：同城学生各科成绩总和高于平均分的学生、平均成绩小于80分的学生，平均成绩大于90分的学生、某城市平均成绩小于80分的学生、某城市平均成绩大于95分的顶尖学生
    </li>
    <li>将查询结果正确显示出来</li>
</ul>
<section>
    <table>
        <tr>
            <th>请输入城市名</th>
            <th>请输入学生名</th>
            <th>请输入语文成绩</th>
            <th>请输入数学成绩</th>
            <th>请输入英语成绩</th>
            <th>平均分</th>
        </tr>
        <tr id="inputRow">
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td>
                <div class="oper" contenteditable="true"></div>
            </td>
            <td colspan="1">
                <div class="oper" contenteditable="true"></div>
            </td>
        </tr>
        <tbody id="score">

        </tbody>
        <tr>
            <td>
                <button type="button" id="enter_grades">录入成绩</button>
            </td>
            <td>
                <button type="button" id="city_avgScore">同城学生各科成绩总和高于平均分的学生</button>
            </td>
            <td>
                <button type="button" id="eight_Avg">平均成绩小于80分的学生</button>
            </td>
            <td>
                <button type="button" id="nine_Avg">平均成绩大于90分的学生</button>
            </td>
            <td>
                <button type="button" id="city_eightAvg">某城市平均成绩小于80分的学生</button>
            </td>
            <td>
                <button type="button" id="city_nineAvg">某城市平均成绩大于95分的顶尖学生</button>
            </td>
        </tr>
        <tbody id="scoreResult">

        </tbody>
        <tr>
            <td colspan="6">
                <button id="clear">清除所有</button>
            </td>
        </tr>
    </table>
    <script type="text/javascript">
        // 录入学生成绩

        // 创建数组收集信息
        let students = []

        //获取"录入成绩"按钮
        document.getElementById("enter_grades").onclick = function () {
            // 每次点击，重新获取第一行输入的新值
            const fistRpw = document.querySelectorAll("#inputRow .oper")
            const city = fistRpw[0].innerText.trim()
            const name = fistRpw[1].innerText.trim()
            const chinese = parseFloat(fistRpw[2].innerText.trim())
            const math = parseFloat(fistRpw[3].innerText.trim())
            const english = parseFloat(fistRpw[4].innerText.trim())

            // 简单校验：城市、姓名不能为空，成绩必须是有效数字
            if (!city || !name || isNaN(chinese) || isNaN(math) || isNaN(english)) {
                return alert("请完整填写城市、姓名和各科成绩(数字)")

            }

            // 创建学生对象并存入数组
            const student = [city, name, chinese, math, english]
            students.push(student)

            //动态添加，显示表格 #score中
            const scoreTbody = document.getElementById("score")
            const newRow = scoreTbody.insertRow() // 直接在 tbody末尾添加行

            //插入单元格 inseCell插入单元格
            const cityCell = newRow.insertCell(0)
            const nameCell = newRow.insertCell(1)
            const chineseCell = newRow.insertCell(2)
            const mathCell = newRow.insertCell(3)
            const englishCell = newRow.insertCell(4)
            const AvgCell = newRow.insertCell(5)
            //为单元格附上内容
            cityCell.innerText = city
            nameCell.innerText = name
            chineseCell.innerText = chinese
            mathCell.innerText = math
            englishCell.innerText = english
            const avg = ((chinese + math + english) / 3).toFixed(2)
            AvgCell.innerText = avg


            // 清空第一行，方便继续录入
            fistRpw.forEach(cell => cell.innerText = "")

            //提示录入成功
            console.log(`已录学生：${name},当前共有${students.length}人`)
        }
    </script>
    <script>
        //完善查询
        const btnCity_avgScore = document.getElementById("city_avgScore")
        const btnEight_Avg = document.getElementById("eight_Avg")
        const btnNine_Avg = document.getElementById("nine_Avg")
        const btnCity_eightAvg = document.getElementById("city_eightAvg")
        const btnCity_nineAvg = document.getElementById("city_nineAvg")
        // 结果显示区域
        const scoreTbody = document.getElementById("scoreResult")

        // 辅助函数：渲染结果表格（接收学生数组，每个学生是 [城市,姓名,语文,数学,英语] 格式）
        function renderResult(studentsArray, title) {
            scoreTbody.innerText = ''
            if (studentsArray.length === 0) {
                const row = scoreTbody.insertRow()
                const cell = row.insertCell(0)
                cell.colSpan = 6
                cell.innerText = `${title}没有符合条件的学生`
                return
            }
            for (let stu of studentsArray) {
                const row = scoreTbody.insertRow()
                const city = stu[0]
                const name = stu[1]
                const chinese = stu[2]
                const math = stu[3]
                const english = stu[4]
                const avg = ((chinese + math + english) / 3).toFixed(2)
                row.insertCell(0).innerText = city
                row.insertCell(1).innerText = name
                row.insertCell(2).innerText = chinese
                row.insertCell(3).innerText = math
                row.insertCell(4).innerText = english
                row.insertCell(5).innerText = avg
            }
        }

        // 同城学生各科成绩总和高于平均分的学生
        btnCity_avgScore.onclick = function () {
            if (students.length === 0) {
                renderResult([], '同城学生各科成绩总和高于平均分的学生');
                return
            }
            // 先按城市分组，再计算每个城市的学生总分平均成绩
            const cityMap = {}
            for (let stu of students) {
                const city = stu[0]
                const total = stu[2] + stu[3] + stu[4] // 各科总分
                if (!cityMap[city]) {
                    cityMap[city] = {totalScore: 0, count: 0}
                }
                const data = cityMap[city]
                data["totalScore"] += total
                data["count"]++
            }
            // 计算每个城市的平均分
            const avgCityScore = {}
            for (let city in cityMap) {
                const data = cityMap[city]
                avgCityScore[city] = data.totalScore / data.count
            }
            // 筛选：学生个人平均分 > 所在城市平均分
            const result = students.filter(stu => {
                const city = stu[0]
                const total = stu[2] + stu[3] + stu[4]
                return total > avgCityScore[city]
            })
            renderResult(result, `同城学生各科成绩总分高于平均分的学生`)
        }
        // 平均分小于80分的学生
        btnEight_Avg.onclick = function () {
            if (students.length === 0) {
                renderResult([], "平均分小于80分的学生")
                return
            }
            const Filter = students.filter(stu => {
                const avg = (stu[2] + stu[3] + stu[4]) / 3
                return avg < 80
            })
            renderResult(Filter, `小于80分的学生`)
        }
        // 平均成绩大于90分的学生
        btnNine_Avg.onclick = function () {
            if (students.length === 0) {
                renderResult([], "平均成绩大于90分的学生")
                return
            }
            const Filter = students.filter(stu => {
                const avg = (stu[2] + stu[3] + stu[4]) / 3
                return avg > 90
            })
            renderResult(Filter, "平均成绩大于90分的学生")
        }
        // 某城市平均成绩小于80分的学生
        btnCity_eightAvg.onclick = function () {
            if (students.length === 0) {
                renderResult([], "没有学生数据");
                return;
            }

            const cityName = prompt("请输入要查询的城市名：", "")
            if (!cityName) return alert("没有符合的城市")

            //筛选出该城市的所有学生
            const Filter = students.filter(stu => {
                if (stu[0] !== cityName) return false
                const avg = (stu[2] + stu[3] + stu[4]) / 3
                return avg < 80
            })
            if (Filter.length === 0) {
                renderResult([], `城市 "${cityName}" 没有平均分低于80分的学生`)
            } else {
                renderResult(Filter, `城市 "${cityName}" 中平均分低于80分的学生`)
            }
        }
        // 某城市平均成绩大于95分的顶尖学生
        btnCity_nineAvg.onclick = function () {
            if (students.length === 0) {
                renderResult([], "某城市平均成绩大于90分的顶尖学生")
                return
            }
            const cityName = prompt("请输入要查询的城市名：", "")
            if (!cityName) return alert("没有符合的城市")

            // 筛选出该城市的所有学生
            const cityStudents = students.filter(stu => {
                if (stu[0] !== cityName) return false
                const avg = (stu[2] + stu[3] + stu[4]) / 3
                return avg > 95
            })
            // 计算该城市的平均分(所有学生成绩的平均值)
            if (cityStudents.length === 0) {
                renderResult([], `城市 "${cityName}" 没有平均分高于95分的学生`)
            } else {
                renderResult(cityStudents, `城市 "${cityName}" 中平均分高于95分的学生`)
            }
        }
    </script>
    <script>
        const clearBtn = document.getElementById("clear")
        if (clearBtn)
            clearBtn.onclick = function () {
                document.getElementById("score").innerHTML = ""
                document.getElementById("scoreResult").innerHTML = ""
                document.querySelectorAll("#inputRow .oper").forEach(cell => cell.innerHTML = '');
                students = []
                alert("已清除所有数据")
            }
    </script>
</section>
</body>
</html>
