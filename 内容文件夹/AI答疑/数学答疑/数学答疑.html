<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学答疑 · 多问题</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0e1a27; color: #dce7f3; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; }
  .tabbar { height: 43px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #132232; border-bottom: 1px solid #2c4358; }
  .tabs { display: flex; gap: 5px; overflow-x: auto; min-width: 0; flex: 1; }
  .tab { flex: 0 0 auto; max-width: 210px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px 4px 10px; border: 1px solid #33485d; border-radius: 8px; background: #142232; color: #9fb6c9; font-size: 12px; cursor: pointer; }
  .tab.active { background: #244b66; border-color: #4f8db3; color: #f0f8ff; }
  .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .close { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; }
  .close:hover { background: rgba(255,255,255,.14); }
  .add { flex: none; width: 30px; height: 29px; border: 1px solid #3d5a72; border-radius: 8px; background: #172536; color: #a9d8f5; font-size: 20px; line-height: 1; cursor: pointer; }
  .add:hover { background: #244b66; }
  .frames, iframe { width: 100%; height: calc(100vh - 43px); }
  iframe { display: block; border: 0; background: #fff; }
  iframe[hidden] { display: none; }
</style>
</head>
<body>
<div class="tabbar">
  <div class="tabs" id="tabs"></div>
  <button type="button" class="add" id="add" title="新建问题标签" aria-label="新建问题标签">+</button>
</div>
<div class="frames" id="frames"></div>
<script>
(function () {
  "use strict";
  var PAGE = '数学答疑-单页.html?embed=1';
  var MAX = 8;
  var tabs = [];
  var active = "";
  var seq = 0;
  var tabsEl = document.getElementById("tabs");
  var framesEl = document.getElementById("frames");
  var addEl = document.getElementById("add");

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function titleOf(value) {
    var text = String(value || "").replace(/\s+/g, " ").trim();
    return text ? (text.length > 18 ? text.slice(0, 18) + "…" : text) : "新问题";
  }

  function render() {
    tabsEl.innerHTML = tabs.map(function (tab) {
      return '<div class="tab' + (tab.id === active ? " active" : "") + '" data-tab="' + esc(tab.id) + '" role="tab">' +
        '<span class="tab-title">' + esc(tab.title) + '</span>' +
        '<button type="button" class="close" data-close="' + esc(tab.id) + '" title="关闭标签">×</button></div>';
    }).join("");
  }

  function activate(id) {
    active = id;
    tabs.forEach(function (tab) {
      var frame = document.getElementById(tab.frameId);
      if (frame) frame.hidden = tab.id !== id;
    });
    render();
  }

  function bindTitle(frame, tab) {
    frame.addEventListener("load", function () {
      try {
        var doc = frame.contentDocument;
        var question = doc && doc.getElementById("question");
        if (!question) return;
        question.addEventListener("input", function () {
          tab.title = titleOf(question.value);
          render();
        });
        if (question.value) {
          tab.title = titleOf(question.value);
          render();
        }
      } catch (error) { /* 同源页面正常可访问 */ }
    });
  }

  function add() {
    if (tabs.length >= MAX) {
      alert("最多同时保留 " + MAX + " 个问题标签，请先关闭旧标签。");
      return;
    }
    var id = "t" + (++seq).toString(36);
    var frameId = "f" + id;
    var frame = document.createElement("iframe");
    frame.id = frameId;
    frame.title = '数学答疑' + "问题 " + tabs.length;
    frame.src = PAGE;
    frame.hidden = true;
    framesEl.appendChild(frame);
    var tab = { id: id, frameId: frameId, title: "新问题" };
    tabs.push(tab);
    bindTitle(frame, tab);
    activate(id);
  }

  function close(id) {
    var index = tabs.findIndex(function (tab) { return tab.id === id; });
    if (index < 0) return;
    var old = tabs[index];
    var frame = document.getElementById(old.frameId);
    if (frame) frame.remove();
    tabs.splice(index, 1);
    if (!tabs.length) {
      add();
      return;
    }
    if (active === id) activate(tabs[Math.max(0, index - 1)].id);
    else render();
  }

  tabsEl.addEventListener("click", function (event) {
    var closeEl = event.target.closest("[data-close]");
    if (closeEl) {
      event.stopPropagation();
      close(closeEl.getAttribute("data-close"));
      return;
    }
    var tabEl = event.target.closest("[data-tab]");
    if (tabEl) activate(tabEl.getAttribute("data-tab"));
  });
  addEl.addEventListener("click", add);
  add();
})();
</script>
</body>
</html>
