<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MathML 降级渲染 · 自检与性能</title>
<style>
  body { margin: 0; font: 14px/1.5 Consolas, monospace; }
  #hud { position: fixed; inset: 0 0 auto 0; background: #fffbe6; border-bottom: 2px solid #e8a317; padding: 10px 14px; z-index: 9; white-space: pre; }
  iframe { width: 1180px; height: 3000px; border: 0; margin-top: 90px; display: block; }
</style>
</head>
<body>
<div id="hud">加载中…</div>
<iframe id="f" src="about:blank"></iframe>
<script>
  var src = new URLSearchParams(location.search).get('src');
  var f = document.getElementById('f');
  f.src = src;
  setTimeout(function () {
    var out = [];
    try {
      var w = f.contentWindow, d = f.contentDocument;
      var s = w.MathMLFallback;
      out.push('mode=' + (s ? s.mode : '(无)') + '   reason=' + (s ? s.reason : '(无)'));
      out.push('converted=' + (s ? s.stats.converted : '?') + '   failed=' + (s ? s.stats.failed : '?') + '   ms=' + (s ? s.stats.ms : '?'));
      out.push('html[data-mathml]=' + d.documentElement.getAttribute('data-mathml') + '   .mfb 节点=' + d.querySelectorAll('.mfb').length + '   剩余 <math>=' + d.querySelectorAll('math').length);
      out.push('ua=' + w.navigator.userAgent);
    } catch (e) { out.push('读取失败：' + e.message); }
    document.getElementById('hud').textContent = out.join('\n');
  }, 3000);
</script>
</body>
</html>
